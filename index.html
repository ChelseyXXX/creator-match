<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="CreatorMatch finds the Instagram creators a brand should review first." />
    <title>CreatorMatch</title>
    <style>
      :root { color-scheme: light; --ink:#171713; --paper:#f4f2ea; --lime:#dff277; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      main { min-height:100vh; display:grid; grid-template-rows:auto 1fr auto; padding:28px clamp(24px,6vw,88px); }
      nav { display:flex; align-items:center; gap:12px; font-weight:750; letter-spacing:-.03em; }
      .mark { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; background:var(--ink); color:white; font-size:14px; }
      section { align-self:center; max-width:900px; padding:10vh 0; }
      .eyebrow { display:inline-flex; padding:8px 12px; border:1px solid rgba(23,23,19,.18); border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
      h1 { max-width:850px; margin:28px 0 22px; font-family:Georgia,"Times New Roman",serif; font-size:clamp(54px,9vw,112px); font-weight:400; line-height:.92; letter-spacing:-.055em; }
      p { max-width:620px; margin:0 0 38px; color:#55554d; font-size:clamp(17px,2vw,21px); line-height:1.55; }
      a { display:inline-flex; align-items:center; gap:28px; padding:17px 20px 17px 24px; border-radius:16px; background:var(--ink); color:white; text-decoration:none; font-weight:750; transition:transform .2s ease,background .2s ease; }
      a span { display:grid; place-items:center; width:31px; height:31px; border-radius:9px; background:var(--lime); color:var(--ink); }
      a:hover { transform:translateY(-2px); background:#2c2c25; }
      footer { display:flex; justify-content:space-between; gap:20px; padding-top:20px; border-top:1px solid rgba(23,23,19,.16); color:#6c6c63; font-size:12px; }
      @media (max-width:600px) { main { padding:22px; } footer { flex-direction:column; } }
    </style>
  </head>
  <body>
    <main>
      <nav><span class="mark">C</span> CreatorMatch</nav>
      <section>
        <span class="eyebrow">Creator intelligence</span>
        <h1>Find the right creators, faster.</h1>
        <p>Turn a campaign brief into a focused, explainable shortlist of Instagram creators worth reviewing.</p>
        <a href="https://creatormatch.xueyuntong377.chatgpt.site">Open CreatorMatch <span>↗</span></a>
      </section>
      <footer><span>CreatorMatch</span><span>NYU FORC 2026 research prototype</span></footer>
    </main>
  </body>
</html>
